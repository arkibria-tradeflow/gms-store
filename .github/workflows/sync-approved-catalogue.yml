name: Sync approved GMS catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: gms-approved-catalogue-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Export approved products from private Sheet
        env:
          GMS_GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GMS_GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: node scripts/sync-approved-catalogue.cjs
      - name: Commit approved-only catalogue if changed
        run: |
          if git diff --quiet -- data/approved-products.json; then
            echo "No approved catalogue changes"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/approved-products.json
          git commit -m "Sync approved GMS product catalogue"
          git push
